name: Publish ROCK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "3-22.04"

permissions:
  contents: read

jobs:
  build-rock:
    name: Build rock
    uses: canonical/data-platform-workflows/.github/workflows/build_rock.yaml@v50.2.1

  trivy:
    needs: [build-rock]
    uses: ./.github/workflows/trivy.yaml
    with:
      submit_dependency_graph: true
    permissions:
      contents: write # dependency graph
      security-events: write

  release:
    name: Release rock
    needs: [build-rock]
    uses: canonical/data-platform-workflows/.github/workflows/release_rock_edge.yaml@v50.2.1
    with:
      artifact-prefix: ${{ needs.build-rock.outputs.artifact-prefix }}
    permissions:
      packages: write # Needed to publish to GitHub Container Registry
      contents: write # Needed to create git tags
