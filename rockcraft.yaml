---
name: charmed-zookeeper
base: ubuntu@22.04
version: "3.9.2"
summary: Charmed ZooKeeper ROCK OCI
description: |
  This is an OCI image that bundles Apache ZooKeeper together with other tools
  of its ecosystem in order to be used in Charmed Operators, providing
  automated operations management from day 0 to day 2 on the Apache ZooKeeper
  distributed coodrdinator, on top of a Virtual Machine cluster and K8s cluster.
  It is an open source, end-to-end, production ready data platform on top of
  cloud native technologies.
license: Apache-2.0

platforms:
  amd64:
  arm64:

run_user: _daemon_

environment:
  JAVA_HOME: /usr/lib/jvm/java-11-openjdk-${CRAFT_ARCH_BUILD_FOR}
  ZOO_LOG_DIR: /var/log/zookeeper
  ZOOCFGDIR: /etc/zookeeper

services:
  zookeeper:
    override: replace
    command: >
      /opt/zookeeper/bin/zkServer.sh
      --config /etc/zookeeper start-foreground
    startup: enabled

parts:
  zookeeper:
    plugin: nil
    stage-packages:
      - openjdk-11-jre-headless
      - libpsl5
      - curl
    overlay-packages:
      - openjdk-11-jre-headless
    stage-snaps:
      - charmed-zookeeper/3/edge
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/opt/zookeeper/
      mkdir -p $CRAFT_PART_INSTALL/etc/zookeeper/

      cp $CRAFT_PART_INSTALL/opt/zookeeper/conf/zoo_sample.cfg \
        $CRAFT_PART_INSTALL/etc/zookeeper/zoo.cfg
      rm -rf $CRAFT_PART_INSTALL/opt/zookeeper/conf
    override-prime: |
      craftctl default
      rm -vf usr/lib/jvm/java-11-openjdk-${CRAFT_ARCH_BUILD_FOR}/lib/security/cacerts

  non-root-user:
    after: [zookeeper]
    plugin: nil
    override-prime: |
      ZOOKEEPER_GID=584792
      ZOOKEEPER_UID=584792

      craftctl default

      chown -R ${ZOOKEEPER_UID}:${ZOOKEEPER_GID} opt/zookeeper
      chmod -R 750 opt/zookeeper

      chown -R ${ZOOKEEPER_UID}:${ZOOKEEPER_GID} etc/zookeeper
      chmod -R 750 etc/zookeeper

      install -d -o ${ZOOKEEPER_UID} -g ${ZOOKEEPER_GID} -m 770 \
        var/lib/zookeeper \
        var/log/zookeeper \
        etc/zookeeper
